# ASH RIVER — S01E01 "Headcount" — shot list
#
# The Continuity Auditor checks clue framing against THIS FILE, not against the script.
# A clue that was written but never given a shot does not exist.
#
# Camera doctrine: handheld inside the bus, locked-off outside it — the audience learns
# which side of the boundary they are on before anyone explains there is one. Long lenses
# throughout, so the fire always reads closer than it is.
# Palette: desaturated to grey; the fire is the only saturated thing in any frame.
# Standards: threat shown, injury implied. Cut before impact.

production: ash-river
season: 1
episode: 1
aspect: "16:9"
captions: true
total_duration_sec: 420

shots:

  # ---- b01 THE DOOR ------------------------------------------------------------
  - id: s01
    beat_id: b01
    t_start_sec: 0
    duration_sec: 6
    shot_size: ECU
    lens: 85mm
    movement: locked
    subject: "a hand closing on a bus door lever"
    clock_element: "the lever discolouring with heat"
    provider_hint: motion
    prompt: >
      Extreme close-up, 85mm, locked off. A woman's hand closes around a metal school bus
      door lever that has discoloured with heat. Smoke moves across the frame from below.
      Desaturated grey-green grade, the only saturated colour is orange firelight from
      off-screen low. Grain, no camera shake.
    negative_prompt: "text overlay, watermark, clean bright lighting, calm daylight, extra fingers"
    lines:
      - character: Maren Vale
        text: "— nine. Ten."
        direction: "mid-count, off-screen, close. She is not performing calm; she has simply not stopped counting."
        breath: "controlled with effort"

  - id: s02
    beat_id: b01
    t_start_sec: 6
    duration_sec: 8
    shot_size: MS
    lens: 50mm
    movement: handheld
    subject: "Maren holding the door open while passengers board low under smoke"
    clock_element: "smoke sheeting in around the door frame"
    character_refs: [Maren Vale]
    provider_hint: consistency
    prompt: >
      Medium shot, handheld, 50mm. A woman in a faded orange work jacket braces a folding
      school bus door open while people move past her, bent low under smoke. She does not
      step aside for any of them. Orange rim light from behind camera, everything else
      desaturated. Evening, heavy particulate air.
    negative_prompt: "hero pose, slow motion, clean air, bright key light, watermark"
    lines:
      - character: Maren Vale
        text: "Move. Move, move —"
        direction: "flat, procedural. This is a woman doing a job she has done before."
        breath: "short"

