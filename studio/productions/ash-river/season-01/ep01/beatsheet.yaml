  - id: b01
    t_start_sec: 0
    t_end_sec: 14
    scene: "S1 THE DOOR"
    action: >
      A hand slams a bus door lever that is too hot to hold, and holds it anyway. Smoke
      pours in around the frame. Under it, mid-count, a woman's voice: "—nine. Ten."
    cost: "The skin of her right palm."
    loops_opened: [q_out, q_hands]
    loops_closed: []
    irony_gap: false
    clock_visible: true
    hook: threat_spike
    options_remaining: 6
    bonding_device: competence_under_pressure
    dialogue: true

  - id: b02
    t_start_sec: 14
    t_end_sec: 38
    scene: "S1 THE DOOR"
    action: >
      Passengers board through smoke. The lever swings before Maren's hand reaches it —
      somebody inside has pulled it. She counts them past her: nine, ten, eleven. She
      never says one through eight. Josie counts too, out loud, from one.
    cost: "Ninety seconds of road, and the last of the daylight on the west side."
    loops_opened: [q_count]
    loops_closed: []
    irony_gap: true
    clock_visible: true
    hook: null
    options_remaining: 6
    twist_level: 1
    bonding_device: visible_private_wound
