# ASH RIVER — S01E01 "Headcount"
#
# Timestamp skeleton first, dialogue second. This file is what the Retention Engine
# grades; script.md is its dramatisation. Beats tile 0-420 with no gaps, because a gap
# is screen time nobody graded.
#
# `cost` is the field writers fake. If a beat cannot name what it took away, it is
# decoration and its seconds belong to a beat that costs something.

production: ash-river
season: 1
episode: 1
title: "Headcount"
runtime_target_sec: 420
prior_cliffhanger: null          # series opener — the cold open stands alone
protective_duty_character: Theo Barrow
wound_shown_beat: b02            # she counts from nine
wound_said_beat: null            # never explained in E01, and not for eleven episodes
logline: >
  Eleven people, one road out of a burning valley, and a driver who counts them at every
  stop. On the last count of the day she gets twelve.

beats:

