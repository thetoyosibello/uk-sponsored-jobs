  # ---- SCENE 8: THE CORRIDOR ---------------------------------------------------
  - id: b15
    t_start_sec: 350
    t_end_sec: 402
    scene: "S8 THE CORRIDOR"
    action: >
      Fifty seconds of road between two burning ridges, and a green corridor untouched
      between them. Maren says nothing to the cabin. On the radio: "You know this road."
      — "Everybody knows this road." — a beat — "Not like you do." She does not answer
      that either. She checks the mirror four times and does not look at anyone in it.
    cost: >
      The pretence, held since the first minute, that she is just the driver. She knows
      she should tell them what she counted and she cannot make herself do it.
