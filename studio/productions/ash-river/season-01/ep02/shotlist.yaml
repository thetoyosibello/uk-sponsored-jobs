# Ten clue slots were allocated to this episode by the twist ledger before E01 shipped.
# Every one has a frame here; the Continuity Auditor checks this file, not the script.
#
# Camera doctrine: handheld inside the bus, locked-off outside it. Long lenses.
# Palette: desaturated grey; the fire is the only saturated thing in frame.
# Standards: threat shown, injury implied. Nel's loss lands on the empty doorway.

